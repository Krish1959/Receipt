<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>Raj Govin Law Practice – Digital Records</title>
<style>
  :root {
    --navy: #1f3a5f;
    --navy-soft: #f1f5fb;
    --ink: #1d232b;
    --muted: #6b7380;
    --line: #c9d1dc;
    --bg: #e9edf2;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }
  .sheet {
    width: min(210mm, 100% - 24px);
    margin: 16px auto;
    background: #fff;
    border-radius: var(--radius);
    box-shadow: 0 2px 14px rgba(0,0,0,.12);
    padding: clamp(18px, 5vw, 18mm) clamp(16px, 5vw, 20mm);
  }
  h1.title {
    margin: 0;
    text-align: center;
    color: var(--navy);
    font-size: clamp(20px, 5.6vw, 28px);
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .address {
    text-align: center;
    font-size: clamp(11px, 3.1vw, 13px);
    color: var(--muted);
    margin: 4px 0 0;
  }
  .doc-label {
    text-align: center;
    font-weight: 800;
    letter-spacing: .4em;
    font-size: clamp(14px, 4vw, 16px);
    margin: 10px 0 0;
    padding-left: .4em;
  }
  hr.rule { border: 0; border-top: 2px solid var(--navy); margin: 16px 0 18px; }

  .section-label {
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px;
  }

  /* ---------- Choices ---------- */
  .choices { display: flex; flex-direction: column; gap: 12px; }
  .choice {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 16px; min-height: 56px;
    border: 1px solid var(--line); border-radius: 6px;
    cursor: pointer; font-weight: 600; font-size: 17px; user-select: none;
  }
  .choice input { accent-color: var(--navy); width: 20px; height: 20px; margin: 0; flex: 0 0 auto; }
  .choice:has(input:checked) { border-color: var(--navy); background: var(--navy-soft); }
  .choice .sub { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* ---------- Buttons ---------- */
  .actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn {
    flex: 1; min-height: 50px; font: inherit; font-weight: 600; font-size: 16px;
    border-radius: 6px; border: 1px solid var(--navy); cursor: pointer;
    background: var(--navy); color: #fff; padding: 0 8px;
  }
  .btn.ghost { background: #fff; color: var(--navy); }
  .foot { margin-top: 14px; text-align: center; font-size: 12.5px; color: var(--muted); }

  @media (max-width: 560px) {
    .sheet { width: 100%; margin: 0; border-radius: 0; box-shadow: none; min-height: 100vh; }
    .actions { flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  }
</style>
</head>
<body>

<main class="sheet">
  <h1 class="title">Raj Govin Law Practice</h1>
  <p class="address">People's Park Centre, #05-48, Singapore 058357</p>
  <p class="doc-label">DIGITAL RECORDS</p>
  <hr class="rule">

  <p class="section-label">What would you like to do?</p>

  <form id="chooser" autocomplete="off">
    <div class="choices" role="radiogroup" aria-label="Choose a task">
      <label class="choice">
        <input type="radio" name="task" value="receipt.html" checked>
        <span>Create a Receipt<span class="sub">Money received from a client</span></span>
      </label>
      <label class="choice">
        <input type="radio" name="task" value="invoice.html">
        <span>Create an Invoice<span class="sub">Bill a client for fees and disbursements</span></span>
      </label>
      <label class="choice">
        <input type="radio" name="task" value="pettycash.html">
        <span>Submit Petty-cash Claim<span class="sub">Office expenses paid out of pocket</span></span>
      </label>
    </div>

    <div class="actions">
      <button type="button" class="btn ghost" id="sheetBtn">Open Google Sheet</button>
      <button type="submit" class="btn">Continue</button>
    </div>
  </form>

  <p class="foot">All entries are saved to the practice's Google Drive.</p>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);

  // Continue -> open the chosen page
  $('chooser').addEventListener('submit', e => {
    e.preventDefault();
    const sel = document.querySelector('input[name="task"]:checked');
    if (sel) window.location.href = sel.value;
  });

  // Open Google Sheet (URL comes from the server; the fallback keeps the button useful offline)
  let sheetUrl = 'https://docs.google.com/spreadsheets/d/1t3Ty5NRJ4X1SWkfJZ7wYdG6UdbIXB94ORPTtuFBZK4Y/edit?gid=0#gid=0';
  fetch('/api/config').then(r => r.json()).then(c => { if (c && c.sheetUrl) sheetUrl = c.sheetUrl; }).catch(() => {});
  $('sheetBtn').addEventListener('click', () => window.open(sheetUrl, '_blank', 'noopener'));
})();
</script>
</body>
</html>
